# kagent launch configuration
# Usage: uv run k8s/launch.py --tag <tag> [--field value]
# CLI args override these values

tag: apr16  # research tag

# competition
competition_repo: https://github.com/tcapelle/gram-competition.git  # repo with kaggler/ + organizer/; kaggler branches are pushed here
competition_branch: main  # branch kagglers start from

# agent
agent_model: "anthropic/claude-opus-5-5:high"  # pi model as provider/id[:thinking]
max_timeout_min: 30  # training timeout in minutes

# git (kagent infra: k8s/, pi config, shared python deps)
repo_url: https://github.com/tcapelle/kagent.git
repo_branch: main

# docker image
image: ghcr.io/tcapelle/kagent:latest

# W&B
wandb_entity: wandb-applied-ai-team
wandb_project: kagent-v2

# students
n_kagglers: 8
organizer: true
